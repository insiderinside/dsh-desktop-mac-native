name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Build & Sanity Check
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || true
          swift --version

      - name: Setup Mock DSH Binary for CI Environment
        run: |
          mkdir -p ~/.local/bin
          echo '#!/bin/sh' > ~/.local/bin/dsh
          echo 'exit 0' >> ~/.local/bin/dsh
          chmod +x ~/.local/bin/dsh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

          # Start mock HTTP listener on 127.0.0.1:3080 in background for PortProbe check
          python3 -m http.server 3080 --bind 127.0.0.1 &
          sleep 1

      - name: Run Sanity Diagnostics Target
        run: |
          swift run DSHDesktopCheck

      - name: Build Universal 2 Binary & Application Bundle
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-universal.sh

      - name: Package Distributable DMG
        run: |
          ./scripts/package-dmg.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-universal
          path: |
            dist/DeepSeek Harness.dmg
            dist/DSHDesktop.app
          retention-days: 14
