name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Build & Sanity Check
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || true
          swift --version

      - name: Run Sanity Diagnostics Target
        run: |
          swift run DSHDesktopCheck

      - name: Build Universal 2 Binary & Application Bundle
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-universal.sh

      - name: Package Distributable DMG
        run: |
          ./scripts/package-dmg.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-universal
          path: |
            dist/DeepSeek Harness.dmg
            dist/DSHDesktop.app
          retention-days: 14
